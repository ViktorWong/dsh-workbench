appId: com.dshworkbench.desktop
productName: dsh-workbench
# AppImage/NSIS binary name — must be filename-safe (package name is not).
executableName: dsh-workbench
# Uniform artifact names; also fixes deb deriving a "@dsh-workbench/" dir
# from the scoped package name.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Deep ad-hoc sign the whole bundle (incl. runtime tree) so macOS Gatekeeper
# needs ONE approval instead of one per runtime binary.
afterPack: ./scripts/after-pack.cjs
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  # Tray icon (loaded by the main process from the asar).
  - build/icon.png
  - package.json
extraResources:
  # Standalone dsh runtime (real node_modules, outside asar) — the packaged
  # app resolves the dsh CLI from here. Produced by `pnpm prepare-runtime`.
  # Point `from` at node_modules directly: electron-builder's copier drops
  # node_modules dirs nested under the copied root.
  - from: runtime/node_modules
    to: runtime/node_modules
    filter: ['**/*']
  # CI runs `pnpm pack` for plugins/* and copies the tarballs + manifest here.
  - from: resources/plugins
    to: plugins
    filter: ['**/*']
mac:
  category: public.app-category.developer-tools
  # Ad-hoc signature: unsigned downloads show as "damaged" on modern macOS;
  # ad-hoc lets them open via right-click → Open. Replace with a real
  # Developer ID identity once a cert is configured (ADR-003 §2.2).
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
publish:
  provider: github
