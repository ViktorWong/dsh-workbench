name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint / typecheck / test / build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:plugins

  # Release pipeline (tag v*) and packaging matrix are added when the desktop
  # app reaches its first releasable milestone — see dsh-devops agent spec.
